name: Fuzz

# Bounded, scheduled fuzzing of the fuzz/ workspace (T-1/S-5/R-6). The
# workspace manifest deliberately excludes fuzz/ (normal for cargo-fuzz), so
# nothing in ci.yml ever builds or runs these targets — this job is the only
# thing keeping them alive.
on:
  schedule:
    # Weekly, Monday 03:17 UTC (odd minute to avoid the on-the-hour rush).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read
  # The scheduled run opens an issue when a target crashes; without this a red
  # weekly run is visible only to whoever thinks to look at the Actions tab.
  issues: write

jobs:
  fuzz:
    name: cargo fuzz (bounded)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the [[bin]] targets in fuzz/Cargo.toml.
        target: [parse_write, syntax_edits, outer_mapping, uml_islands]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      # Without this the corpus libFuzzer discovers is thrown away every run,
      # so each weekly run restarts from the six checked-in seeds and re-derives
      # the same shallow coverage. The key rotates per run so the cache is
      # append-only; restore-keys pull the most recent previous corpus.
      - name: Restore fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-fuzz

      # cargo-fuzz defaults to the triple its OWN binary was built for, and
      # install-action ships a musl build — ASan cannot link against a static
      # musl libc ("sanitizer is incompatible with statically linked libc"), so
      # the target is pinned to the gnu host triple explicitly.
      #
      # A scratch corpus dir comes first so libFuzzer writes new inputs there,
      # not into the checked-in seeds (which are passed read-only as a second
      # corpus dir).
      - name: Fuzz ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=${{ github.event.inputs.max_total_time || 300 }}

      - name: Report a crash
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const target = context.payload.inputs?.target || '${{ matrix.target }}';
            const title = `Fuzz target ${target} is failing`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fuzz',
            });
            const body = [
              `The scheduled fuzz run for \`${target}\` failed.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The crashing input is attached to that run as an artifact.',
            ].join('\n');
            const match = existing.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['fuzz'],
              });
            }

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
