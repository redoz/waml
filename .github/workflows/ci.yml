name: CI

# There is deliberately no `push: [main]` trigger here. pages.yml calls this
# workflow via `workflow_call` and gates the deploy on it, so a push to main
# runs this gate exactly once instead of twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · test · build
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the parser is path/line based
        # and cross-platform bugs have shipped to main before (no gate existed).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # The VS Code extension is a standalone Node project; its
          # "packageManager" field pins the pnpm version.
          package_json_file: editors/vscode/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches the "engines.node" floor in editors/vscode/package.json.
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Install VS Code extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/vscode

      # waml-editor pulls in makepad's Linux backend, whose wayland-sys build
      # script probes pkg-config and panics outright when the .pc files are
      # absent. The x11/GL/audio libraries are what the resulting test binaries
      # then link against.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The UI test harness cargo-builds waml-editor in release with
          # MAKEPAD=headless into crates/waml-editor/target (the makepad test
          # driver pins CARGO_TARGET_DIR to the editor manifest dir). Cache it
          # or every CI run pays for a cold release build of makepad.
          cache-directories: |
            crates/waml-editor/target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo nextest run --workspace --profile ci

      # The harness spawns the editor through the studio hub, which runs
      # `cargo build -p waml-editor --release` with MAKEPAD=headless and then
      # execs the binary. Prebuild that exact configuration here so a compile
      # failure fails this step with readable errors (the in-test build's
      # output is swallowed) and the in-test build is a warm no-op instead of
      # eating the startup timeout.
      - name: Prebuild headless editor for UI tests
        if: runner.os == 'Linux'
        env:
          MAKEPAD: headless
          CARGO_TARGET_DIR: crates/waml-editor/target
        run: cargo build -p waml-editor --release

      # This step carries the RENDERING GATE as well as the semantic
      # scenarios. Linux is its platform of record and not by preference: the
      # fork's headless shader loader is unix-only, so on Windows every shader
      # compiles, none loads, and the virtual GPU produces a flat rectangle.
      # This is the only place in CI where anything looks at pixels.
      - name: Semantic editor UI test
        if: runner.os == 'Linux'
        run: cargo test -p waml-editor --features ui-tests --test ui -- --test-threads=1

      # Two different jobs for one upload, and both matter.
      #
      # On FAILURE it carries the rendering gate's evidence off the runner:
      # the capture, the red/green overlay of what moved, and the mask that
      # would make the change the new reference. A gate whose failure output
      # dies with the runner is a gate nobody can act on.
      #
      # On SUCCESS it carries any reference the gate RECORDED because none
      # existed for this platform yet. That is how the first reference gets
      # committed: download it from this artifact and add it to
      # crates/waml-editor/tests/references/. Until one is committed the gate
      # is advisory here and says so in its trace.
      - name: Upload rendering gate evidence
        # `always()` first: a step whose condition does not mention it is
        # skipped once an earlier step has failed, which is exactly the run
        # whose evidence is worth keeping.
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendering-gate-${{ github.run_id }}
          path: target/waml-ui-test/
          if-no-files-found: ignore
          retention-days: 14

      # nextest does not run doctests at all -- it would skip them silently, so
      # they get their own step.
      - name: Cargo doctest
        run: cargo test --workspace --doc

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The root package.json that used to gate this test went away with the
      # node workspace; the script itself still ships the Pages artifact.
      # Quoted so node's own glob expansion runs the whole suite on every OS
      # (same invocation pages.yml uses at deploy time).
      - name: Web artifact script tests
        run: node --test "scripts/*.test.mjs"

      - name: VS Code build
        run: pnpm build
        working-directory: editors/vscode

      - name: VS Code test
        run: pnpm test
        working-directory: editors/vscode

      - name: VS Code lint
        run: pnpm lint
        working-directory: editors/vscode

  doc-contract:
    # docs/waml is dogfooded as a live bundle, and this is the gate that keeps
    # it honest. It runs as its own job rather than as the first step of
    # build-test: there it executed before anything had compiled under test, so
    # a failure here masked every code failure behind it — the exact ordering
    # that already hid a broken CI for three days.
    name: documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: WAML documentation contract
        run: |
          cargo run -p waml-cli -- check docs/waml
          cargo run -p waml-cli -- fmt --check docs/waml
          cargo run -p waml-cli -- index docs/waml --check
          node scripts/check-waml-doc-contract.mjs docs/waml

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-deny

      # advisories: RUSTSEC entries in the lockfile (yanked crates included).
      # licenses:   every distributed dependency's licence is one we allow and
      #             attribute in THIRD-PARTY.md.
      # bans:       no unpinned wildcard on a published dependency.
      # sources:    no git dependency from an account other than the fork.
      - name: Cargo deny
        run: cargo deny check

  wasm-check:
    name: wasm32 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # waml and waml-ops-dto must keep compiling for the web target; the
      # only wasm build otherwise happens at Pages deploy time, after merge.
      # See Task 3 of docs/superpowers/plans/2026-08-10-waml-cli-logic-seam.md.
      - name: Cargo check waml (serde feature) for wasm32
        run: cargo check -p waml --features serde --target wasm32-unknown-unknown

      - name: Cargo check waml (no default features) for wasm32
        run: cargo check -p waml --target wasm32-unknown-unknown

      - name: Cargo check waml-ops-dto for wasm32
        run: cargo check -p waml-ops-dto --target wasm32-unknown-unknown

      # Until this existed, waml-editor was first built for wasm at deploy
      # time, after merge — so a wasm-breaking editor change passed PR CI and
      # broke main's Pages deploy instead.
      - name: Cargo check waml-editor for wasm32
        run: cargo check -p waml-editor --target wasm32-unknown-unknown
