name: CI

# There is deliberately no `push: [main]` trigger here. pages.yml calls this
# workflow via `workflow_call` and gates the deploy on it, so a push to main
# runs this gate exactly once instead of twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · test · build
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the parser is path/line based
        # and cross-platform bugs have shipped to main before (no gate existed).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # The VS Code extension is a standalone Node project; its
          # "packageManager" field pins the pnpm version.
          package_json_file: editors/vscode/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches the "engines.node" floor in editors/vscode/package.json.
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Install VS Code extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/vscode

      # waml-editor pulls in makepad's Linux backend, whose wayland-sys build
      # script probes pkg-config and panics outright when the .pc files are
      # absent. The x11/GL/audio libraries are what the resulting test binaries
      # then link against.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests at all -- it would skip them silently, so
      # they get their own step.
      - name: Cargo doctest
        run: cargo test --workspace --doc

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The root package.json that used to gate this test went away with the
      # node workspace; the script itself still ships the Pages artifact.
      - name: Web artifact script tests
        run: node --test scripts/inject-runtime-shell.test.mjs

      - name: VS Code build
        run: pnpm build
        working-directory: editors/vscode

      - name: VS Code test
        run: pnpm test
        working-directory: editors/vscode

      - name: VS Code lint
        run: pnpm lint
        working-directory: editors/vscode
