name: CI

# There is deliberately no `push: [main]` trigger here. pages.yml calls this
# workflow via `workflow_call` and gates the deploy on it, so a push to main
# runs this gate exactly once instead of twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · test · build
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the parser is path/line based
        # and cross-platform bugs have shipped to main before (no gate existed).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # The VS Code extension is a standalone Node project; its
          # "packageManager" field pins the pnpm version.
          package_json_file: editors/vscode/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the "engines.node" floor in editors/vscode/package.json.
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Install VS Code extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/vscode

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The root package.json that used to gate this test went away with the
      # node workspace; the script itself still ships the Pages artifact.
      - name: Web artifact script tests
        run: node --test scripts/inject-runtime-shell.test.mjs

      - name: VS Code build
        run: pnpm build
        working-directory: editors/vscode

      - name: VS Code test
        run: pnpm test
        working-directory: editors/vscode

      - name: VS Code lint
        run: pnpm lint
        working-directory: editors/vscode
