# Publishes the makepad waml-editor to GitHub Pages as a WebAssembly app.
#
# Gated on ci.yml: the `ci` job below calls that workflow and the build/deploy
# jobs need it, so a red test suite stops the site from updating. ci.yml has no
# push trigger of its own precisely so this call is the single run for a push
# to main.
name: Publish web editor

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages. `contents: read` is all the build needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The full lint/test gate. Nothing ships unless this is green.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build wasm bundle
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-makepad shells out to `rustup run nightly cargo build` with
      # `-Z build-std=panic_abort,std` and `-Z json-target-spec`, so nightly is
      # a hard requirement and `rust-src` must be present for build-std.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      # The build tool and the framework now sit on the SAME rev, the one
      # crates/waml-editor/Cargo.toml names. They used to be pinned separately --
      # the tool on 7162231f, on the fork branch `waml-wasm-dep-dirs` -- because
      # that was the only line carrying the fix that makes this deploy produce a
      # working site at all: cargo-makepad could not resolve the source directory
      # of a *git* dependency, since `cargo tree` prints the repository URL
      # rather than a path and the `<name>.path` marker its build script writes
      # is absent whenever the build scripts were cached as fresh, which is
      # exactly what the rust-cache step above arranges. It then copied no JS
      # glue at all and exited zero, publishing an index.html importing a runtime
      # that was not there. The verify step below is the standing guard against a
      # repeat.
      #
      # 377ed372 replaces that fix with a better one -- resolve every package's
      # directory from `cargo metadata`'s `manifest_path`, which reports a real
      # path for path, registry and git dependencies alike -- and it is on the
      # line we build against, so the two pins collapse into one.
      #
      # Note the fork carries several rebase-duplicated lines with identical
      # commit messages but different shas, and `waml-scroll-occlusion`'s remote
      # tip is a pre-rebase leftover. Copy an exact sha rather than reading a
      # branch tip, and keep this in step with waml-editor/Cargo.toml.
      - name: Install cargo-makepad
        run: >
          cargo install cargo-makepad
          --git https://github.com/redoz/makepad.git
          --rev f6ca086353b8d50e6d7cd6e3a1daab318bac152f
          --locked

      # binaryen supplies the `wasm-opt` binary that the build step below invokes
      # via cargo-makepad's --wasm-opt flag. The version is pinned rather than
      # resolved from `latest` because cargo-makepad degrades silently: if the
      # binary is missing or errors it prints "wasm-opt: skipped (...)", passes
      # the unoptimised bytes straight through, and exits zero. A broken install
      # would therefore look like a perfectly green deploy of an unoptimised
      # module, which is why the install is pinned here and why the build step
      # greps its own log for the success line and fails when it is absent.
      # Installed into the runner's tool dir rather than /usr/local so the exact
      # pinned binary is the one on PATH.
      - name: Install binaryen
        run: |
          curl -sSfL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_123/bin" >> "$GITHUB_PATH"

      # --no-threads is load-bearing, not an optimisation: the threaded build
      # needs Cross-Origin-Opener-Policy/Cross-Origin-Embedder-Policy response
      # headers for SharedArrayBuffer, and GitHub Pages cannot set headers.
      # It also implies --small-fonts, which drops ~48 MB of CJK/emoji fonts
      # pulled in from makepad-widgets/resources.
      # --strip drops the wasm custom sections -- the symbol `name` section alone
      # is 4.7 MB of the 14.2 MB module. Measured on the deployed artifact:
      # 14.19 MB -> 9.49 MB raw (-33% browser parse/compile work) and
      # 3.46 MB -> 2.88 MB gzipped over the wire (-17%). The cost is that panic
      # backtraces in the browser console lose function names.
      # --wasm-opt runs `wasm-opt --all-features -Os` over the already-stripped
      # module. Measured on the deployed artifact: 9.49 MB -> 8.54 MB raw, a 10%
      # cut in bytes the browser has to parse and compile. It buys almost nothing
      # over the wire (2.890 MB -> 2.888 MB gzipped) because gzip was already
      # squeezing the redundancy that -Os removes; the win is startup work, not
      # download size.
      #
      # The output is teed and inspected because cargo-makepad treats every
      # wasm-opt failure -- missing binary, bad flags, non-zero exit -- as a
      # no-op: it prints "wasm-opt: skipped (...)", emits the untouched bytes and
      # succeeds. Without this check a silently unoptimised module would deploy
      # under a green tick and nobody would notice. Require the success line and
      # reject the skip line.
      - name: Build
        run: |
          set -o pipefail
          cargo makepad wasm build -p waml-editor --release --no-threads --strip --wasm-opt 2>&1 | tee /tmp/build.log
          if grep -q 'wasm-opt: skipped' /tmp/build.log; then
            echo "::error::wasm-opt did not run; the module deployed unoptimised. See the 'wasm-opt: skipped' line above."
            exit 1
          fi
          if ! grep -qE 'wasm-opt: [0-9]+ -> [0-9]+ bytes' /tmp/build.log; then
            echo "::error::no wasm-opt success line in the build log; the --wasm-opt flag or its output format has changed."
            exit 1
          fi

      # cargo-makepad mirrors every crate's entire resources/ tree next to the
      # wasm, which for waml-editor means 148 font files (~52 MB) when the app
      # names 8. Prune to what the source actually references: 67 MB -> 17 MB.
      # Only needed to run the dependency-free scripts/*.mjs below; there is no
      # root package.json (the VS Code extension owns its own in editors/vscode).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The widget fonts live in makepad's own resources tree and are named from
      # makepad's DSL, so pruning them needs that checkout's sources. `cargo
      # metadata` reports a real path for a git dependency, which is how
      # cargo-makepad resolves the same directories.
      - name: Locate the makepad sources
        run: |
          manifest=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name=="makepad-widgets") | .manifest_path')
          if [ -z "$manifest" ]; then
            echo "::error::cargo metadata reports no makepad-widgets package"
            exit 1
          fi
          echo "MAKEPAD_SRC=$(dirname "$manifest")/src" >> "$GITHUB_ENV"

      - name: Prune unreferenced fonts
        run: >
          node scripts/prune-web-fonts.mjs
          target/makepad-wasm-app/release/waml-editor
          "$MAKEPAD_SRC"

      # cargo-makepad generates index.html and titles it after the crate, so the
      # tab icon and title have to be patched into the artifact rather than
      # checked in. Uses the same icon.ico the Windows exe embeds.
      - name: Brand the artifact
        run: node scripts/brand-web-artifact.mjs target/makepad-wasm-app/release/waml-editor

      # Writes version.json and patches index.html with the logo loading screen
      # and the new-version check. The commit sha is the build id: the check
      # compares the deployed version.json against the value baked into the
      # loaded page, so it only has to be unique per deploy.
      - name: Inject the runtime shell
        run: >
          node scripts/inject-runtime-shell.mjs
          target/makepad-wasm-app/release/waml-editor
          ${{ github.sha }}

      # Everything above this line can fail silently by producing an artifact
      # that is merely incomplete, which is how a blank site shipped under a
      # green tick. Assert that every file the artifact references -- scripts,
      # imports, stylesheets, the wasm -- is actually in the artifact, and that
      # the script's own tests still pass, before anything is uploaded.
      - name: Test the artifact scripts
        run: node --test "scripts/*.test.mjs"

      - name: Verify the artifact is complete
        run: node scripts/verify-web-artifact.mjs target/makepad-wasm-app/release/waml-editor

      # From here the site is assembled by the product itself rather than by
      # hand: the verified artifact is compressed into the CLI, and
      # `waml export site` writes the editor plus the docs bundle it boots.
      # A site nobody can export locally is a site whose deploy path is only
      # ever exercised here, which is how the last silent-blank-page shipped.
      - name: Package the artifact for embedding
        run: >
          node scripts/package-web-artifact.mjs
          target/makepad-wasm-app/release/waml-editor
          target/web-embed

      - name: Build the CLI with the editor embedded
        env:
          WAML_WEB_EMBED_DIR: target/web-embed
        run: cargo build -p waml-cli --release --features embed-web

      - name: Export the site
        run: ./target/release/waml export site docs/waml --out target/pages

      # The exported tree is what actually ships, so it -- not the artifact it
      # was assembled from -- is what gets the completeness check.
      - name: Verify the exported site
        run: node scripts/verify-web-artifact.mjs target/pages

      - uses: actions/configure-pages@v6

      # `waml export site` output: the cargo-makepad layout (index.html,
      # waml-editor.wasm, the makepad_platform/* JS glue, one resources/ tree
      # per crate) plus the bundle.waml its index.html boots from.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
