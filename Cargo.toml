[workspace]
resolver = "2"
members = ["crates/waml", "crates/waml-cli", "crates/waml-ops-dto", "crates/waml-editor", "crates/waml-syntax", "crates/waml-markdown-editor"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"

[workspace.dependencies]
regex = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
miniz_oxide = "0.9.1"
ttf-parser = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
tower-lsp = "0.20"
url = "2.5"
proptest = "=1.8.0"
unicode-segmentation = "1.12"
unicode-bidi = { git = "https://github.com/redoz/makepad.git", rev = "2ad354041d545820fec6d2c8384071127adca387" }

