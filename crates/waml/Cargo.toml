[package]
name = "waml"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for parsing, serializing, and validating WAML documents."
# Not published: every crate here refers to its siblings by path, which crates.io
# would reject. Flip this when a crate is actually released.
publish = false

[dependencies]
regex.workspace = true
miniz_oxide.workspace = true
ttf-parser.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
url = { workspace = true }
waml-syntax = { path = "../waml-syntax" }

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
test-support = []

[dev-dependencies]
serde_json = { workspace = true }
proptest.workspace = true

# Measures per-edit semantic reanalysis cost against bundle size (audit A14).
# Not a CI gate: timing gates flap on shared runners. See
# docs/design/bundle-reanalysis-cost.md.
[[bench]]
name = "bundle_reanalysis"
harness = false
