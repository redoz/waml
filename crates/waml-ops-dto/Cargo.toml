[package]
name = "waml-ops-dto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Serde wire contract (OpDto) consumed by the WAML CLI."
# Not published: every crate here refers to its siblings by path, which crates.io
# would reject. Flip this when a crate is actually released.
publish = false

[dependencies]
waml = { path = "../waml", features = ["serde"] }
serde = { workspace = true }

[features]
default = []

[dev-dependencies]
serde_json = { workspace = true }
