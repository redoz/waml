[package]
name = "waml-markdown-editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WAML-owned variable-metric Markdown editing foundation."
# Not published: every crate here refers to its siblings by path, which crates.io
# would reject. Flip this when a crate is actually released.
publish = false

[dependencies]
waml-syntax = { path = "../waml-syntax" }
makepad-widgets = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }
