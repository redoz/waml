[package]
name = "waml-editor"
default-run = "waml-editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native, read-only GPU viewer for WAML/OKF diagrams."

[dependencies]
waml = { path = "../waml", features = ["serde"] }
waml-markdown-editor = { path = "../waml-markdown-editor" }
# Pinned to a fork of makepad/makepad@dev (redoz/makepad, branch `waml` -- the
# single integration line every fork change lands on from here; it was cut at
# the tip of fix/web-batched-shader-link, the richest lineage, and the other
# waml-* branches are pre-rebase leftovers, so do NOT pin to them. Pin a SHA on
# `waml`, never the branch name: a moving ref would drift builds silently.
# `waml` adds a read-only accessor for FileTree's animated folder-open amount,
# so the tree panel's fold chevron rotates off the real animation instead of a
# second timer. Below it, fix/web-batched-shader-link stacks two web boot fixes on
# fix/layout-params-wasm: web takes the shared DrawTextSlug helper instead of inlining the
# curve solver into every text shader (~40s to ~9s), and web now issues every shader link
# before querying any of them so ANGLE compiles them in parallel (~9s to ~1.8s) —
# which is the line rebased onto the newer upstream dev — NOT waml-scroll-occlusion, whose
# remote tip is a pre-rebase leftover from 07-20 —
# stacked on waml-fxc-opt, adds handled_x/handled_y scroll occlusion to hits() so overlays
# and popups stop bleeding scroll into the canvas; also carries two web fixes — Startup
# dispatched before the window pool is indexed, and separator-agnostic crate manifest paths
# so wasm built on a Windows host still resolves fonts, and opt-in single-touch mouse
# emulation so touch devices reach the raw-MouseEvent chrome, and a resize that reallocs the
# WebGL buffer and repaints in the same task so Edge stops flashing black through a window
# drag). Also includes Markdown heading anchors, fragment scrolling, and app-owned Markdown
# vertical scroll snapshot/restore from waml-history-scroll-anchors-current. The FileTree
# fold and draw hooks were reverted once waml took ownership of the tree row list.
# rev is the reproducible pin; survives upstream force-push / branch renames.
makepad-widgets = { git = "https://github.com/redoz/makepad.git", rev = "7bb5e50a99094c8f82a8ef00e13bc63037ef14d8" }
taffy = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# `home_dir()` for the `~/.waml` config root (see src/config.rs).
dirs = "6.0.0"
rfd = "0.17.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native mirrors telemetry to stderr (`fmt`) behind a RUST_LOG-overridable
# filter (`env-filter`); wasm keeps the registry-only baseline -- EnvFilter's
# env read and stderr writer have no business in the browser build.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds resources/icon.ico into the exe (see build.rs).
winresource = "0.1"

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
waml = { path = "../waml", features = ["serde", "test-support"] }
waml-syntax = { path = "../waml-syntax" }
waml-ui-test = { path = "../waml-ui-test" }

[features]
ui-tests = []

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["ui-tests"]
