[package]
name = "waml-editor"
default-run = "waml-editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native, read-only GPU viewer for WAML/OKF diagrams."

[dependencies]
waml = { path = "../waml", features = ["serde"] }
# Pinned to a fork of makepad/makepad@dev (redoz/makepad, branch waml-scroll-occlusion —
# stacked on waml-fxc-opt, adds handled_x/handled_y scroll occlusion to hits() so overlays
# and popups stop bleeding scroll into the canvas; also carries two web fixes — Startup
# dispatched before the window pool is indexed, and separator-agnostic crate manifest paths
# so wasm built on a Windows host still resolves fonts, and opt-in single-touch mouse
# emulation so touch devices reach the raw-MouseEvent chrome, and a resize that reallocs the
# WebGL buffer and repaints in the same task so Edge stops flashing black through a window
# drag). Also includes Markdown heading anchors, fragment scrolling, and app-owned FileTree
# folder toggles, plus app-owned Markdown vertical scroll snapshot/restore from
# waml-history-scroll-anchors-current. rev is the reproducible pin; survives upstream
# force-push / branch renames.
makepad-widgets = { git = "https://github.com/redoz/makepad.git", rev = "e82da432" }
taffy = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# `home_dir()` for the `~/.waml` config root (see src/config.rs).
dirs = "6.0.0"
rfd = "0.17.2"

[target.'cfg(windows)'.build-dependencies]
# Embeds resources/icon.ico into the exe (see build.rs).
winresource = "0.1"

[dev-dependencies]
waml = { path = "../waml", features = ["serde", "test-support"] }
waml-syntax = { path = "../waml-syntax" }
