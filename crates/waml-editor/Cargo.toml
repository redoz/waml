[package]
name = "waml-editor"
default-run = "waml-editor"
version = "0.0.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "Native, read-only GPU viewer for WAML/OKF diagrams."
# Not published: every crate here refers to its siblings by path, which crates.io
# would reject. Flip this when a crate is actually released.
publish = false

[dependencies]
waml = { path = "../waml", features = ["serde"] }
waml-ops-dto = { path = "../waml-ops-dto" }
waml-markdown-editor = { path = "../waml-markdown-editor" }
merman = { version = "=0.8.0-alpha.5", default-features = false, features = ["svg"] }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
# The fork pin, and the prose explaining it, live in the workspace manifest.
makepad-widgets = { workspace = true }
taffy = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# `home_dir()` for the `~/.waml` config root (see src/config.rs).
dirs = "6.0.0"
rfd = "0.17.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native mirrors telemetry to stderr (`fmt`) behind a RUST_LOG-overridable
# filter (`env-filter`); wasm keeps the registry-only baseline -- EnvFilter's
# env read and stderr writer have no business in the browser build.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds resources/icon.ico into the exe (see build.rs).
winresource = "0.1"

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
waml = { path = "../waml", features = ["serde", "test-support"] }
waml-syntax = { path = "../waml-syntax" }
waml-ui-test = { path = "../waml-ui-test" }

[features]
browser-test-trace = []
ui-tests = []

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["ui-tests"]
