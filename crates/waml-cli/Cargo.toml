[package]
name = "waml-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tools (check, fmt) for WAML documents."

[[bin]]
name = "waml"
path = "src/main.rs"

[features]
default = []
# Embed the CI-built web editor so `waml export site` can write a complete,
# self-contained site. Off by default: an ordinary build and `cargo test` must
# never need a WASM toolchain or a prebuilt artifact.
embed-web = []

[dependencies]
waml = { path = "../waml" }
waml-ops-dto = { path = "../waml-ops-dto" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-lsp = { workspace = true }
brotli = "7"
