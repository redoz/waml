[package]
name = "waml-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tools (check, fmt) for WAML documents."
# Not published: every crate here refers to its siblings by path, which crates.io
# would reject. Flip this when a crate is actually released.
publish = false

[[bin]]
name = "waml"
path = "src/main.rs"

[features]
default = []
# Embed the CI-built web editor so `waml export site` can write a complete,
# self-contained site. Off by default: an ordinary build and `cargo test` must
# never need a WASM toolchain or a prebuilt artifact.
embed-web = []

[dependencies]
waml = { path = "../waml", features = ["serde"] }
waml-ops-dto = { path = "../waml-ops-dto" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-lsp-server = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
brotli = { workspace = true }

[build-dependencies]
brotli = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tempfile = { workspace = true }
